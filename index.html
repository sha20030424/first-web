<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>梗图档案馆 · 2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2313151c'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#070809;
    --bg-soft:#0c0e13;
    --panel:rgba(255,255,255,.035);
    --panel-2:rgba(255,255,255,.055);
    --line:rgba(255,255,255,.085);
    --line-2:rgba(255,255,255,.16);
    --text:#e9ebf2;
    --text-2:#a2a8ba;
    --text-3:#6f7587;
    --accent:#b07cff;
    --accent-2:#3ce0c0;
    --grad:linear-gradient(115deg,#b07cff 0%,#7d8cff 45%,#3ce0c0 100%);
    --radius:18px;
    --header-h:72px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  /* ---------- ambient background ---------- */
  .aura{position:fixed;inset:0;pointer-events:none;z-index:0}
  .aura i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
  .aura i:nth-child(1){width:620px;height:620px;left:-180px;top:-220px;background:radial-gradient(circle,#6d3bd4 0%,transparent 68%)}
  .aura i:nth-child(2){width:560px;height:560px;right:-160px;top:8%;background:radial-gradient(circle,#12776b 0%,transparent 68%);opacity:.42}
  .aura i:nth-child(3){width:700px;height:700px;left:22%;bottom:-380px;background:radial-gradient(circle,#2a2f6b 0%,transparent 70%);opacity:.4}
  .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;
    background:
      radial-gradient(1200px 700px at 18% -10%,rgba(176,124,255,.10),transparent 60%),
      radial-gradient(900px 600px at 92% 6%,rgba(60,224,192,.07),transparent 60%);
  }
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 50%,transparent 42%,rgba(0,0,0,.62) 100%)}

  /* ---------- header ---------- */
  header{
    position:relative;z-index:5;height:var(--header-h);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 34px;border-bottom:1px solid var(--line);
    background:rgba(7,8,9,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .brand{display:flex;align-items:center;gap:12px}
  .mark{
    width:34px;height:34px;border-radius:11px;background:var(--grad);
    display:grid;place-items:center;font-size:17px;
    box-shadow:0 6px 22px rgba(125,110,255,.35);
  }
  .brand h1{font-size:16px;font-weight:650;letter-spacing:.04em}
  .brand h1 span{color:var(--text-3);font-weight:400;margin-left:8px;font-size:12.5px;letter-spacing:.08em}
  .hmeta{display:flex;align-items:center;gap:22px;font-size:12.5px;color:var(--text-3);letter-spacing:.03em}
  .hmeta b{color:var(--text);font-weight:600}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-2);display:inline-block;margin-right:7px;
    box-shadow:0 0 0 0 rgba(60,224,192,.6);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(60,224,192,.5)}70%{box-shadow:0 0 0 9px rgba(60,224,192,0)}100%{box-shadow:0 0 0 0 rgba(60,224,192,0)}}

  /* ---------- weather ---------- */
  .hleft{display:flex;align-items:center;gap:18px;min-width:0}
  .weather{position:relative;flex:none}
  .wpill{
    display:flex;align-items:center;gap:9px;cursor:pointer;font-family:inherit;
    padding:7px 14px 7px 12px;border-radius:999px;white-space:nowrap;
    border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);
    transition:border-color .22s,background .22s,transform .22s;
  }
  .wpill:hover{border-color:var(--line-2);background:rgba(255,255,255,.085)}
  .wpill:active{transform:scale(.98)}
  .wpill[aria-expanded="true"]{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:rgba(176,124,255,.12)}
  .wpill .wi{font-size:15px;line-height:1}
  .wpill .wt{font-size:13.5px;font-weight:640;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .wpill .wc{font-size:12px;color:var(--text-2);max-width:6.5em;overflow:hidden;text-overflow:ellipsis}
  .wpill.busy .wi{opacity:.35}
  .wpill.busy .wt::after{content:"…"}
  .wpill.err{border-color:rgba(239,68,68,.4)}

  .wpanel{
    position:absolute;left:0;top:calc(100% + 12px);width:330px;z-index:30;
    border-radius:20px;border:1px solid var(--line-2);padding:18px;
    background:linear-gradient(180deg,#151821,#0b0c11);
    box-shadow:0 30px 74px rgba(0,0,0,.72);
    opacity:0;transform:translateY(-8px) scale(.985);pointer-events:none;
    transition:opacity .22s,transform .22s;
  }
  .wpanel.on{opacity:1;transform:none;pointer-events:auto}
  .wtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .wname{font-size:15px;font-weight:650;letter-spacing:.01em}
  .wbadge{
    font-size:10px;font-weight:500;letter-spacing:.06em;margin-left:7px;padding:2px 7px;border-radius:999px;
    color:color-mix(in srgb,var(--accent-2) 80%,#fff);border:1px solid color-mix(in srgb,var(--accent-2) 34%,transparent);
    background:color-mix(in srgb,var(--accent-2) 12%,transparent);vertical-align:1px;
  }
  .wsub{margin-top:5px;font-size:11.5px;color:var(--text-3);letter-spacing:.02em}
  .wlocate{
    flex:none;width:30px;height:30px;border-radius:10px;cursor:pointer;font-family:inherit;
    border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text-2);
    font-size:13px;line-height:1;display:grid;place-items:center;transition:all .2s;
  }
  .wlocate:hover{color:var(--text);border-color:var(--line-2);background:rgba(255,255,255,.09)}

  .wmain{margin-top:16px;display:flex;align-items:center;gap:16px}
  .wmain .we{font-size:46px;line-height:1;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
  .wbig{font-size:38px;font-weight:660;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .wbig em{font-style:normal;font-size:17px;font-weight:500;color:var(--text-2);margin-left:2px}
  .wdesc{margin-top:8px;font-size:12.5px;color:var(--text-2)}

  .wgrid{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .wgrid div{
    padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.028);
    display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  }
  .wgrid b{font-weight:400;font-size:11.5px;color:var(--text-3)}
  .wgrid span{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}

  .wfc{margin-top:9px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.028);overflow:hidden}
  .wfcrow{display:flex;align-items:center;gap:12px;padding:9px 12px;font-size:12.5px}
  .wfcrow + .wfcrow{border-top:1px solid rgba(255,255,255,.05)}
  .wfcrow i{font-style:normal;font-size:15px;width:18px;text-align:center}
  .wfcrow span:nth-of-type(1){color:var(--text-2);width:3.4em;flex:none}
  .wfcrow span:nth-of-type(2){margin-left:auto;color:var(--text-3);font-variant-numeric:tabular-nums}
  .wfcrow span:nth-of-type(2) b{color:var(--text);font-weight:600}

  .wsearch{margin-top:16px;display:flex;align-items:center;gap:9px;padding:2px 12px;border-radius:11px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);transition:border-color .2s}
  .wsearch:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
  .wsearch svg{flex:none;width:14px;height:14px;stroke:var(--text-3)}
  .wsearch input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);
    font-size:13px;font-family:inherit;padding:9px 0}
  .wsearch input::placeholder{color:var(--text-3)}
  .wlist{margin-top:9px;display:flex;flex-direction:column;gap:5px;max-height:172px;overflow-y:auto}
  .wlist::-webkit-scrollbar{width:5px}
  .wlist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:99px}
  .witem{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;cursor:pointer;font-family:inherit;
    text-align:left;padding:9px 11px;border-radius:10px;border:1px solid transparent;
    background:rgba(255,255,255,.022);color:var(--text);font-size:13px;transition:all .18s;
  }
  .witem:hover{background:rgba(255,255,255,.07);border-color:var(--line)}
  .witem em{font-style:normal;font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wlistempty{padding:12px 4px;font-size:12.5px;color:var(--text-3);text-align:center}
  .werr{padding:18px 4px;font-size:12.5px;color:var(--text-2);line-height:1.8;text-align:center}
  .werr u{cursor:pointer;color:var(--accent);text-decoration:none}

  /* ---------- stage ---------- */
  .stage{position:relative;z-index:4;height:calc(100vh - var(--header-h));display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr)}
  .wallhead{
    display:flex;align-items:center;gap:10px;
    font-size:11.5px;letter-spacing:.22em;color:var(--text-3);text-transform:uppercase;
    padding:20px 0 14px;
  }
  .wallhead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  /* ---------- left wall ---------- */
  .wall{padding:0 0 0 34px;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
  .marquee{
    flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:16px;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 62px,#000 calc(100% - 78px),transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0,#000 62px,#000 calc(100% - 78px),transparent 100%);
  }
  .mcol{overflow:hidden;position:relative}
  .mgroup{display:flex;flex-direction:column;gap:16px;padding-bottom:16px}
  .mtrack{display:flex;flex-direction:column;animation:rollUp 74s linear infinite;will-change:transform}
  .mtrack.rev{animation:rollDown 92s linear infinite}
  .marquee:hover .mtrack{animation-play-state:paused}
  @keyframes rollUp{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,-50%,0)}}
  @keyframes rollDown{from{transform:translate3d(0,-50%,0)}to{transform:translate3d(0,0,0)}}

  .mcard{
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    transition:border-color .28s,transform .28s,box-shadow .28s;
  }
  .mcard:hover{border-color:var(--line-2);transform:translateY(-3px);box-shadow:0 18px 44px rgba(0,0,0,.5)}
  .poster{
    position:relative;aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden;
    background:
      radial-gradient(90% 120% at 22% 8%,color-mix(in srgb,var(--c1) 42%,transparent),transparent 62%),
      radial-gradient(90% 120% at 88% 96%,color-mix(in srgb,var(--c2) 46%,transparent),transparent 60%),
      linear-gradient(160deg,#12141b,#0a0b0f);
  }
  .poster::before{
    content:"";position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1px);
    background-size:14px 14px;
    -webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent);
    mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent);
  }
  .poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.5))}
  .pemoji{position:relative;z-index:2;font-size:54px;line-height:1;filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}
  .pcap{
    position:absolute;z-index:3;left:14px;bottom:11px;right:14px;
    font-size:12.5px;color:rgba(255,255,255,.82);letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .mtitle{padding:13px 14px 4px;font-size:14.5px;font-weight:620;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 14px;gap:8px}
  .chip{
    font-size:11px;padding:3.5px 9px;border-radius:999px;letter-spacing:.03em;
    border:1px solid color-mix(in srgb,var(--c1) 46%,transparent);
    color:color-mix(in srgb,var(--c1) 72%,#fff);
    background:color-mix(in srgb,var(--c1) 12%,transparent);
    white-space:nowrap;
  }
  .heat{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ---------- right panel ---------- */
  .panel{display:flex;flex-direction:column;min-width:0;padding:0 46px 26px 46px}
  .hero{padding:52px 0 0}
  .hero h2{font-size:34px;line-height:1.26;font-weight:660;letter-spacing:-.015em}
  .hero h2 em{
    font-style:normal;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{margin-top:12px;font-size:13.5px;color:var(--text-2);line-height:1.75;max-width:44ch}

  .searchbox{
    margin-top:26px;display:flex;align-items:center;gap:12px;
    padding:8px 8px 8px 18px;border-radius:16px;
    border:1px solid var(--line-2);background:rgba(255,255,255,.05);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:border-color .25s,box-shadow .25s,background .25s;
  }
  .searchbox:focus-within{
    border-color:color-mix(in srgb,var(--accent) 62%,transparent);
    background:rgba(255,255,255,.07);
    box-shadow:0 0 0 4px rgba(176,124,255,.12),0 14px 40px rgba(0,0,0,.4);
  }
  .searchbox svg{flex:none;width:17px;height:17px;stroke:var(--text-3)}
  .searchbox input{
    flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);
    font-size:14.5px;font-family:inherit;padding:11px 0;
  }
  .searchbox input::placeholder{color:var(--text-3)}
  .btn{
    flex:none;border:0;cursor:pointer;font-family:inherit;
    padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:600;letter-spacing:.03em;
    color:#0a0b0f;background:var(--grad);
    transition:transform .2s,filter .2s;
  }
  .btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
  .btn:active{transform:translateY(0)}

  .quick{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .quick span{font-size:11.5px;color:var(--text-3);letter-spacing:.06em;margin-right:2px}
  .qchip{
    cursor:pointer;font-size:12px;padding:6px 13px;border-radius:999px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text-2);
    transition:all .2s;font-family:inherit;
  }
  .qchip:hover{border-color:var(--line-2);color:var(--text);background:rgba(255,255,255,.07)}

  .results{margin-top:28px;flex:1;min-height:0;overflow-y:auto;padding-right:8px;padding-bottom:10px}
  .results::-webkit-scrollbar{width:6px}
  .results::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
  .rhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .rhead h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-3);font-weight:500}
  .rhead em{font-style:normal;font-size:12px;color:var(--text-3)}

  .ritem{
    display:flex;gap:14px;align-items:flex-start;padding:13px;border-radius:15px;
    border:1px solid transparent;cursor:pointer;transition:all .22s;margin-bottom:8px;
  }
  .ritem:hover{background:var(--panel);border-color:var(--line)}
  .ritem .rank{
    flex:none;width:20px;text-align:center;font-size:13px;font-weight:700;
    color:var(--text-3);font-variant-numeric:tabular-nums;padding-top:29px;
  }
  .ritem:nth-child(2) .rank,.ritem:nth-child(3) .rank,.ritem:nth-child(4) .rank{color:var(--text)}
  .thumb{
    flex:none;width:62px;height:62px;border-radius:13px;display:grid;place-items:center;font-size:27px;
    background:
      radial-gradient(110% 110% at 25% 10%,color-mix(in srgb,var(--c1) 52%,transparent),transparent 65%),
      radial-gradient(110% 110% at 85% 95%,color-mix(in srgb,var(--c2) 52%,transparent),transparent 62%),
      linear-gradient(160deg,#15181f,#0b0c11);
    border:1px solid var(--line);
  }
  .rmain{min-width:0;flex:1}
  .rtop{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .rtop h4{font-size:14.5px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rdesc{font-size:12.5px;color:var(--text-2);line-height:1.62;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rtags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .rtags i{
    font-style:normal;font-size:10.5px;color:var(--text-3);border:1px solid var(--line);
    padding:2.5px 8px;border-radius:6px;letter-spacing:.02em;
  }

  .empty{padding:52px 8px;text-align:center;color:var(--text-3);font-size:13px;line-height:2}
  .empty b{display:block;font-size:28px;margin-bottom:14px;opacity:.5}
  .empty u{cursor:pointer;color:var(--accent);text-decoration:none;margin:0 4px}

  /* ---------- modal ---------- */
  .modal{
    position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:34px;
    background:rgba(4,5,7,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  }
  .modal.on{display:grid;animation:fade .26s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{
    width:min(720px,100%);max-height:calc(100vh - 68px);overflow-y:auto;
    border-radius:24px;border:1px solid var(--line-2);
    background:linear-gradient(180deg,#12141b,#0a0b0f);
    box-shadow:0 40px 100px rgba(0,0,0,.7);animation:rise .3s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes rise{from{transform:translateY(18px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .sheet::-webkit-scrollbar{width:7px}
  .sheet::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:99px}
  .shead{position:relative;padding:36px 38px 30px;overflow:hidden;
    background:
      radial-gradient(80% 130% at 20% 0%,color-mix(in srgb,var(--c1) 40%,transparent),transparent 62%),
      radial-gradient(80% 130% at 92% 100%,color-mix(in srgb,var(--c2) 42%,transparent),transparent 60%),
      linear-gradient(160deg,#171a22,#0b0c11);
  }
  .shead::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:76px;pointer-events:none;
    background:linear-gradient(180deg,transparent,#0e1015);
  }
  .shead .big{font-size:62px;line-height:1;filter:drop-shadow(0 12px 26px rgba(0,0,0,.6))}
  .shead h2{margin-top:18px;font-size:25px;font-weight:660;letter-spacing:-.01em}
  .sclose{
    position:absolute;top:20px;right:22px;width:34px;height:34px;border-radius:11px;cursor:pointer;
    border:1px solid var(--line-2);background:rgba(0,0,0,.32);color:var(--text-2);
    font-size:17px;line-height:1;display:grid;place-items:center;font-family:inherit;transition:all .2s;
  }
  .sclose:hover{color:#fff;background:rgba(0,0,0,.6)}
  .sbody{padding:26px 38px 34px}
  .srow{margin-bottom:22px}
  .srow:last-child{margin-bottom:0}
  .slabel{font-size:11px;letter-spacing:.2em;color:var(--text-3);text-transform:uppercase;margin-bottom:9px}
  .slabel em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--text-3);opacity:.7;margin-left:8px;font-size:11px}
  .srow p{font-size:13.8px;line-height:1.85;color:var(--text-2)}
  .quote{
    border-left:2px solid color-mix(in srgb,var(--accent) 70%,transparent);
    padding:13px 16px;border-radius:0 12px 12px 0;background:rgba(176,124,255,.07);
    font-size:14px;line-height:1.8;color:var(--text);
  }
  .vlist{display:flex;flex-wrap:wrap;gap:7px}
  .vlist i{font-style:normal;font-size:12px;color:var(--text-2);border:1px solid var(--line);
    padding:4px 11px;border-radius:8px;background:var(--panel)}
  .jump{display:flex;flex-wrap:wrap;gap:8px}
  .jump button{

function buildWall(){

    const one = arr.map(i=>cardHTML(MEMES[i],i)).join("");
    el.innerHTML = `<div class="mgroup">${one}</div><div class="mgroup">${one}</div>`;
  };
  fill(A, $("#colA"));
  fill(B, $("#colB"));
  $("#total").textContent = MEMES.length;
}

/* 中文没有词边界：长句按 2~3 字滑窗切分，再做场景词扩展 */
function tokenize(raw){
  const base = raw.toLowerCase().split(/[\s,，、/|.。!！?？~]+/).filter(Boolean);
  const toks = new Set(base);
  base.forEach(t=>{
    if(/[\u4e00-\u9fa5]/.test(t) && t.length > 2){
      for(let n=2;n<=3;n++) for(let i=0;i+n<=t.length;i++) toks.add(t.slice(i,i+n));
    }
  });
  return [...toks];
}
function expandIntent(raw){
  const set = new Set(), ql = raw.toLowerCase();
  Object.keys(EXPAND).forEach(k=>{ if(ql.includes(k)) EXPAND[k].forEach(t=>set.add(t)); });
  return set;
}
function search(raw){
  const q = raw.trim().toLowerCase();
  if(!q) return null;
  const words = raw.toLowerCase().split(/[\s,，、/|.。!！?？~]+/).filter(Boolean);
  const grams = tokenize(raw).filter(t => !words.includes(t));
  const extra = expandIntent(raw);

  return MEMES.map((m,i)=>{
    let score = 0; const hits = new Set();
    const hay = {
      t:m.t.toLowerCase(), cat:m.cat.toLowerCase(),
      mean:m.mean.toLowerCase(), origin:m.origin.toLowerCase(),
      ex:m.ex.toLowerCase(), cap:m.cap.toLowerCase(),
      tags:m.tags.join(" ").toLowerCase(), vs:m.vs.join(" ").toLowerCase()
    };
    // 整句命中，权重最高
    if(q.length > 1){
      if(hay.t.includes(q)){ score += 42; hits.add("标题"); }
      if(hay.tags.includes(q) || hay.cap.includes(q)){ score += 24; hits.add("语义"); }
    }
    // 完整词
    words.forEach(t=>{
      let w = 0;
      if(hay.t.includes(t)) w = Math.max(w, 13);
      if(hay.tags.includes(t)) w = Math.max(w, 8);
      if(hay.cat.includes(t)) w = Math.max(w, 7);
      if(hay.vs.includes(t)) w = Math.max(w, 5);
      if(hay.cap.includes(t)) w = Math.max(w, 4);
      if(hay.mean.includes(t) || hay.origin.includes(t)) w = Math.max(w, 3);
      if(hay.ex.includes(t)) w = Math.max(w, 2);
      score += w;
      if(w >= 7) hits.add("关键词");
    });
    // 长句滑窗片段：只做轻量加权，避免"完全不会命中的话"这类句子乱命中
    grams.forEach(t=>{
      if(hay.t.includes(t) || hay.tags.includes(t) || hay.cat.includes(t)){ score += 2; hits.add("关键词"); }
      else if(hay.vs.includes(t) || hay.cap.includes(t) || hay.mean.includes(t) || hay.origin.includes(t)) score += 1;
    });
    // 场景意图扩展
    extra.forEach(tag=>{
      if(m.tags.includes(tag) || m.cat === tag){ score += 11; hits.add("场景"); }
    });
    return { m, i, raw: score, score: Math.round(score + m.heat * 0.15), hits:[...hits] };
  }).filter(r => r.raw >= 8).sort((a,b)=>b.score-a.score || b.m.heat-a.m.heat);
}

function renderHot(){
  const list = MEMES.map((m,i)=>({m,i})).sort((a,b)=>b.m.heat-a.m.heat).slice(0,8);
  $("#results").innerHTML = `<div class="rhead"><h3>热搜榜 · TOP 8</h3><em>共 ${MEMES.length} 条收录</em></div>` +
    list.map((r,n)=>itemHTML(r.m, r.i, n+1, null)).join("");
}
function renderResults(rs, q){
  const box = $("#results");
  if(!rs.length){
    box.innerHTML = `<div class="empty"><b>🕳️</b>
      没找到贴合的梗。<br>换个说法试试，或者直接逛榜单：<br>
      <u data-q="打工人">打工人</u><u data-q="情绪自愈">情绪自愈</u><u data-q="AI 摸鱼">AI 摸鱼</u><u data-q="抽象">抽象</u>
      </div>`;
    return;
  }
  box.innerHTML = `<div class="rhead"><h3>匹配结果</h3><em>「${esc(q)}」命中 ${rs.length} 条</em></div>` +
    rs.map((r,n)=>itemHTML(r.m, r.i, n+1, r.hits)).join("");
}
function itemHTML(m, i, rank, hits){
  const tags = (hits && hits.length)
    ? hits.map(h=>`<i>命中${h}</i>`).concat([`<i>${esc(m.cat)}</i>`,`<i>🔥 ${m.heat} · ${heatLabel(m.heat)}</i>`])
    : [`<i>${esc(m.cat)}</i>`,`<i>🔥 ${m.heat} · ${heatLabel(m.heat)}</i>`];
  return `<div class="ritem" data-i="${i}">
    <div class="rank">${rank}</div>
    <div class="thumb" style="--c1:${m.c1};--c2:${m.c2}">${m.e}</div>
    <div class="rmain">
      <div class="rtop"><h4>${esc(m.t)}</h4></div>
      <div class="rdesc">${esc(m.mean)}</div>
      <div class="rtags">${tags.join("")}</div>
    </div>
  </div>`;
}

document.addEventListener("click", e=>{
  const card = e.target.closest(".mcard,.ritem");
  if(card){ openDetail(+card.dataset.i); return; }
  const jb = e.target.closest(".jump button");
  if(jb){ openDetail(+jb.dataset.i); return; }
  const qc = e.target.closest(".qchip, .empty u");
  if(qc){ doSearch(qc.dataset.q); return; }
  if(e.target.closest(".sclose")){ closeDetail(); return; }
  if(e.target.id === "modal"){ closeDetail(); }
});
document.addEventListener("keydown", e=>{
  if(e.key !== "Escape") return;
  closeDetail();
  if(W.on){ W.on = false; $("#wpanel").classList.remove("on"); wRenderPill(); }
});

function doSearch(v){
  const val = (v !== undefined ? v : $("#q").value).trim();
  if(v !== undefined) $("#q").value = v;
  if(!val){ renderHot(); return; }
  renderResults(search(val), val);
  $("#results").scrollTop = 0;
}
$("#form").addEventListener("submit", e=>{ e.preventDefault(); doSearch(); });

let t = null;
$("#q").addEventListener("input", e=>{
  clearTimeout(t);
  t = setTimeout(()=>{
    const v = e.target.value.trim();
    if(!v){ renderHot(); return; }
    if(v.length < 1) return;
    renderResults(search(v), v);
  }, 220);
});

/* ============================================================
   实时天气 —— Open-Meteo（免密钥、支持跨域）
   定位链：本地缓存 → 浏览器定位 → IP 定位 → 北京兜底
   ============================================================ */
const WMO = {
  0:["晴","☀️"],1:["晴间多云","🌤️"],2:["多云","⛅"],3:["阴","☁️"],
  45:["雾","🌫️"],48:["冻雾","🌫️"],
  51:["小毛毛雨","🌦️"],53:["毛毛雨","🌦️"],55:["大毛毛雨","🌦️"],
  56:["冻毛毛雨","🌧️"],57:["冻毛毛雨","🌧️"],
  61:["小雨","🌦️"],63:["中雨","🌧️"],65:["大雨","🌧️"],
  66:["冻雨","🌧️"],67:["冻雨","🌧️"],
  71:["小雪","🌨️"],73:["中雪","🌨️"],75:["大雪","❄️"],77:["米雪","🌨️"],
  80:["阵雨","🌦️"],81:["阵雨","🌧️"],82:["强阵雨","⛈️"],
  85:["阵雪","🌨️"],86:["强阵雪","❄️"],
  95:["雷阵雨","⛈️"],96:["雷暴伴冰雹","⛈️"],99:["强雷暴伴冰雹","⛈️"]
};
const WKEY = "meme2026.weather.city";
const W = { city:"", lat:null, lon:null, data:null, on:false, src:"", busy:false, err:false };
let wT = null;

function wFetch(url, ms, init){
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), ms || 9000);
  return fetch(url, { ...(init || {}), signal: ctl.signal }).finally(()=>clearTimeout(timer));
}
const wMeta = c => WMO[c] || ["未知","🌡️"];
function wIcon(c, isDay){
  let ic = wMeta(c)[1];
  if(isDay === false) ic = ic.replace("☀️","🌙").replace("🌤️","🌙⛅").replace("⛅","☁️");
  return ic;
}
function wWeekday(iso){
  const d = new Date(iso + "T00:00:00");
  return "周" + "日一二三四五六"[d.getDay()];
}

function wRenderPill(){
  const pill = $("#wpill");
  pill.classList.toggle("busy", W.busy && !W.data);
  pill.classList.toggle("err", W.err && !W.data);
  pill.setAttribute("aria-expanded", W.on ? "true" : "false");
  if(W.busy && !W.data){ $("#wpillIcon").textContent = "📍"; $("#wpillTemp").textContent = "--"; $("#wpillCity").textContent = "定位中"; return; }
  if(W.err && !W.data){ $("#wpillIcon").textContent = "⚠️"; $("#wpillTemp").textContent = "--"; $("#wpillCity").textContent = "点此重试"; return; }
  if(!W.data) return;
  $("#wpillIcon").textContent = wIcon(W.data.code, W.data.isDay);
  $("#wpillTemp").textContent = Math.round(W.data.temp) + "°";
  $("#wpillCity").textContent = W.city || "当前位置";
}

function wRenderPanel(){
  const box = $("#wpanel");
  if(W.busy && !W.data){ box.innerHTML = `<div class="werr">正在获取实时天气…</div>`; return; }
  if(W.err && !W.data){
    box.innerHTML = `<div class="werr">天气加载失败，可能是网络无法访问天气服务。<br><u id="wretry">点此重试</u></div>`;
    $("#wretry").onclick = e => { e.stopPropagation(); wInit(true); };
    return;
  }
  if(!W.data) return;
  const d = W.data, meta = wMeta(d.code);
  box.innerHTML = `
    <div class="wtop">
      <div>
        <div class="wname">${esc(W.city || "当前位置")}<span class="wbadge">实时</span></div>
        <div class="wsub">${esc(d.time)} 更新 · ${esc(W.src)}</div>
      </div>
      <button class="wlocate" id="wlocate" type="button" title="重新定位">◎</button>
    </div>
    <div class="wmain">
      <div class="we">${wIcon(d.code, d.isDay)}</div>
      <div>
        <div class="wbig">${Math.round(d.temp)}<em>°C</em></div>
        <div class="wdesc">${meta[0]} · 体感 ${Math.round(d.feels)}°</div>
      </div>
    </div>
    <div class="wgrid">
      <div><b>湿度</b><span>${Math.round(d.hum)}%</span></div>
      <div><b>风速</b><span>${d.wind} m/s</span></div>
      <div><b>今日最高</b><span>${Math.round(d.max)}°</span></div>
      <div><b>今日最低</b><span>${Math.round(d.min)}°</span></div>
    </div>
    <div class="wfc">${d.fc.map(r=>`<div class="wfcrow"><span>${r.label}</span><i>${r.ic}</i><span><b>${r.max}°</b> / ${r.min}°</span></div>`).join("")}</div>
    <div class="wsearch">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="wq" placeholder="换个城市，如 上海 / Tokyo" autocomplete="off" />
    </div>
    <div class="wlist" id="wlist"></div>`;
  $("#wlocate").onclick = e => { e.stopPropagation(); wInit(true); };
  const wi = $("#wq");
  wi.addEventListener("input", e => { clearTimeout(wT); const v = e.target.value; wT = setTimeout(()=>wSearch(v), 300); });
  wi.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); clearTimeout(wT); wSearch(e.target.value); } });
}

async function wSearch(q){
  const box = $("#wlist");
  if(!q || !q.trim()){ box.innerHTML = ""; return; }
  box.innerHTML = `<div class="wlistempty">搜索中…</div>`;
  try{
    const r = await wFetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q.trim())}&count=6&language=zh&format=json`, 8000);
    const j = await r.json();
    if(!j.results || !j.results.length){ box.innerHTML = `<div class="wlistempty">没找到这个城市</div>`; return; }
    box.innerHTML = j.results.map((c,i)=>
      `<button class="witem" type="button" data-i="${i}">${esc(c.name)}<em>${esc([c.admin1, c.country].filter(Boolean).join(" · "))}</em></button>`
    ).join("");
    box.querySelectorAll(".witem").forEach(el => {
      el.onclick = ev => {
        ev.stopPropagation();
        const c = j.results[+el.dataset.i];
        box.innerHTML = "";
        if($("#wq")) $("#wq").value = "";
        wLoad(c.latitude, c.longitude, c.name, { manual:true });
      };
    });
  }catch(e){
    box.innerHTML = `<div class="wlistempty">搜索失败，请重试</div>`;
  }
}

async function wLoad(lat, lon, city, opts){
  opts = opts || {};
  W.lat = lat; W.lon = lon;
  if(city) W.city = city;
  // 换了个地点就清掉旧读数，避免「新城市名 + 旧温度」错配；同一地点刷新则保留，不闪
  const sameSpot = W.data && Math.abs(W.data.lat - lat) < 1e-6 && Math.abs(W.data.lon - lon) < 1e-6;
  if(!sameSpot) W.data = null;
  W.busy = true; W.err = false;
  wRenderPill();
  if(W.on) wRenderPanel();
  try{
    const url = "https://api.open-meteo.com/v1/forecast"
      + `?latitude=${lat}&longitude=${lon}`
      + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m"
      + "&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=4";
    const r = await wFetch(url, 9000);
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const cu = j.current, dl = j.daily;
    W.data = {
      lat, lon,
      temp: cu.temperature_2m, feels: cu.apparent_temperature,
      hum: cu.relative_humidity_2m, wind: cu.wind_speed_10m,
      code: cu.weather_code, isDay: cu.is_day === 1,
      time: String(cu.time || "").slice(11, 16),
      max: dl.temperature_2m_max[0], min: dl.temperature_2m_min[0],
      fc: dl.time.slice(1, 4).map((tt, i) => {
        const k = i + 1;
        return { label: wWeekday(tt), ic: wIcon(dl.weather_code[k], true),
                 max: Math.round(dl.temperature_2m_max[k]), min: Math.round(dl.temperature_2m_min[k]) };
      })
    };
    W.src = opts.manual ? "手动选择" : opts.cache ? "已保存位置" : (opts.ip ? "IP 定位" : "浏览器定位");
    W.busy = false;
    try{ localStorage.setItem(WKEY, JSON.stringify({ name: W.city, lat, lon })); }catch(e){}
    wRenderPill();
    if(W.on) wRenderPanel();
  }catch(err){
    W.busy = false;
    // 已有内容（缓存或上一次结果）就保留，只标记刷新失败，避免整块消失
    if(W.data) W.src = W.src.replace(/（刷新失败）$/, "") + "（刷新失败）";
    else W.err = true;
    wRenderPill();
    if(W.on) wRenderPanel();
  }
}

async function wCityName(lat, lon){
  try{
    const r = await wFetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`, 6000);
    if(!r.ok) return "";
    const j = await r.json();
    return j.city || j.locality || j.principalSubdivision || "";
  }catch(e){ return ""; }
}

async function wIpLocate(){
  const srcs = ["https://ipwho.is/", "https://ipapi.co/json/"];
  for(const u of srcs){
    try{
      const r = await wFetch(u, 4000);
      if(!r.ok) continue;
      const j = await r.json();
      const lat = Number(j.latitude), lon = Number(j.longitude);
      if(isFinite(lat) && isFinite(lon)) return { lat, lon, city: j.city || "" };
    }catch(e){}
  }
  return null;
}

async function wInit(force){
  W.busy = true; W.err = false;
  wRenderPill();
  if(W.on) wRenderPanel();

  // 1) 缓存：先立刻出内容，避免每次打开都空等定位
  let cached = null;
  if(!force){
    try{ cached = JSON.parse(localStorage.getItem(WKEY) || "null"); }catch(e){ cached = null; }
    if(cached && isFinite(cached.lat) && isFinite(cached.lon)){
      await wLoad(cached.lat, cached.lon, cached.name || "", { cache:true });
    }
  }

  // 2) 浏览器定位：成功且位置与缓存明显不同（约 >5km）才覆盖
  const geo = await new Promise(res => {
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => res(null),
      { timeout: 7000, maximumAge: 600000, enableHighAccuracy: false }
    );
  });
  if(geo){
    const moved = !W.data || Math.abs(geo.lat - W.lat) > 0.05 || Math.abs(geo.lon - W.lon) > 0.05;
    if(moved){
      const name = await wCityName(geo.lat, geo.lon);
      return wLoad(geo.lat, geo.lon, name || "当前位置", {});
    }
    W.src = "浏览器定位";
    wRenderPill();
    if(W.on) wRenderPanel();
    return;
  }

  // 3) 定位不可用：缓存够用就保持，否则走 IP，最后兜底北京
  if(W.data) return;
  const ip = await wIpLocate();
  if(ip) return wLoad(ip.lat, ip.lon, ip.city || "当前位置", { ip:true });

  return wLoad(39.9042, 116.4074, "北京", {});
}

$("#wpill").addEventListener("click", e => {
  e.stopPropagation();
  W.on = !W.on;
  $("#wpanel").classList.toggle("on", W.on);
  wRenderPill();
  if(W.on){
    if(!W.data && !W.busy) wInit(false);
    if(W.data || W.busy || W.err) wRenderPanel();
  }
});
document.addEventListener("click", e => {
  if(W.on && !e.target.closest("#weatherBox")){
    W.on = false;
    $("#wpanel").classList.remove("on");
    wRenderPill();
  }
});

wInit(false);

/* ============================================================
   AI 生图 —— 走本机 server.mjs 代理
   密钥只存在服务端 .env，前端拿不到；且 Replicate 不返回 CORS 头，
   浏览器本来就无法直连，必须经这一层。
   ============================================================ */
const AI = { ready:false, reason:'', account:'', model:'', cache:{}, busy:false };

const AI_HINT = {
  file:    '静态打开时不可用。在项目目录执行 node server.mjs，然后访问 http://127.0.0.1:8788',
  offline: '没检测到本地服务。执行 node server.mjs 后刷新本页',
  notoken: '.env 里缺少 REPLICATE_API_TOKEN',
  badtoken: 'token 无效或已失效，请换一个',
  network: '本机服务连不上 Replicate，检查网络或代理'
};
function aiHint(){
  if(AI.ready) return '按需调用 ' + AI.model + '，每张约 $0.003';
  return AI_HINT[AI.reason] || AI_HINT[AI.reason?.startsWith('http') ? 'network' : 'offline'] || AI_HINT.offline;
}
/* 英文提示词 —— flux 这类模型对英文响应明显更好；
   早先直接用中文长句会画出乱码文字。风格后缀统一视觉。 */
const AI_STYLE = ", minimalist editorial illustration, dark charcoal background, "
  + "neon purple and teal gradient accents, flat vector style, high contrast, "
  + "clean composition, generous negative space, no text, no letters, no words, no watermark, no signature";

function aiPromptFor(m){
  return (m.art || m.t) + AI_STYLE;
}

async function aiProbe(){
  if(location.protocol === 'file:'){ AI.ready = false; AI.reason = 'file'; return; }
  try{
    const r = await wFetch('/api/status', 6000);
    const j = await r.json();
    AI.ready = !!j.ai;
    AI.reason = j.reason || '';
    AI.account = j.account || '';
    AI.model = j.model || '';
  }catch(e){
    AI.ready = false; AI.reason = 'offline';
  }
}

function aiRenderSaved(idx){
  const out = $("#aiOut"), hit = AI.cache[idx];
  if(!out || !hit) return;
  out.innerHTML = `<figure class="aifig">
      <img src="${esc(hit.image)}" alt="AI 生成的插画" />
      <figcaption><a href="${esc(hit.image)}" download>下载图片</a><span>${esc(hit.model || AI.model)}</span></figcaption>
    </figure>`;
}

async function aiGenerate(idx){
  const m = MEMES[idx];
  const btn = $("#aiGo"), stat = $("#aiStat"), out = $("#aiOut");
  if(!btn || AI.busy) return;
  if(!AI.ready){ stat.textContent = aiHint(); return; }

  const prompt = ($("#aiPrompt").value || '').trim();
  if(!prompt){ stat.textContent = '先写点画面描述再生成'; return; }

  AI.busy = true;
  btn.disabled = true;
  btn.textContent = '生成中…';
  const t0 = Date.now();
  stat.textContent = '已用 0s';
  out.innerHTML = `<div class="aiskel"><span></span></div>`;
  const tick = setInterval(()=>{ stat.textContent = '已用 ' + ((Date.now()-t0)/1000).toFixed(0) + 's'; }, 500);

  try{
    const r = await wFetch('/api/generate', 180000, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, aspect_ratio: '16:9' })
    });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || ('HTTP ' + r.status));
    AI.cache[idx] = j;
    stat.textContent = '完成 · ' + (j.ms/1000).toFixed(1) + 's · ' + (j.saved ? '已存到 generated/' : '远程链接');
    aiRenderSaved(idx);
  }catch(e){
    const msg = String((e && e.message) || e);
    stat.textContent = '生成失败';
    out.innerHTML = `<div class="aierr">${esc(msg)}</div>`;
  }finally{
    clearInterval(tick);
    AI.busy = false;
    btn.disabled = false;
    btn.textContent = '重新生成';
  }
}

aiProbe().then(() => {
  // 探测完成后，若弹窗正开着就顺手把状态刷成最新
  if($("#modal").classList.contains("on") && $("#aiStat")) $("#aiStat").textContent = aiHint();
});

renderHot();
</script>
